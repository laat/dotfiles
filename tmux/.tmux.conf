# Prefix
set -g prefix C-b
bind C-b send-prefix

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g escape-time 10
set -g detach-on-destroy off
set -g focus-events on
set -g set-clipboard on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ',*:clipboard'
set -as terminal-features 'xterm-ghostty:hyperlinks'

# Window names: claude's native binary is ~/.local/share/claude/versions/X.Y.Z,
# so its process name (and the auto window name) is a bare version number.
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}"

# Alerts
set -g monitor-activity on
set -g visual-activity off

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits: laatmux split is the plain split in the pane's directory outside a
# workspace session, and inside one a shell at the worktree root on the
# worktree's host, local or over ssh. run-shell has no TMUX_PANE, so the pane
# id is passed in.
bind | run-shell "laatmux split -h '#{pane_id}'"
bind - run-shell "laatmux split -v '#{pane_id}'"

# Pane navigation via smart-splits.nvim (alt+hjkl, no prefix needed)
# Bindings are set automatically by the TPM plugin below

# Pane swapping (cmd+ctrl+hjkl via ghostty sending prefix+HJKL)
bind H swap-pane -s '{left-of}'
bind J swap-pane -s '{down-of}'
bind K swap-pane -s '{up-of}'
bind L swap-pane -s '{right-of}'

# Pane resizing (smart-splits.nvim aware)
# Bindings are set automatically by the TPM plugin below

# New window in current path
bind c new-window -c "#{pane_current_path}"

# cmd+number window switching (via ghostty sending ESC+number)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Nested tmux passthrough
bind -n F12 set prefix None \; set key-table off \; set status-left "#[fg=colour196,bold] OFF " \; display "Outer tmux disabled"
bind -T off F12 set prefix C-b \; set key-table root \; set status-left "" \; display "Outer tmux enabled"
bind -n M-p run-shell "~/.local/bin/tmux-sesh-picker"
bind -T off M-p run-shell "~/.local/bin/tmux-sesh-picker"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Codespaces picker
bind-key "g" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Codespaces' 'tv gh-codespaces'

# Sesh session picker
bind-key "t" run-shell "~/.local/bin/tmux-sesh-picker"

# laatmux agent sidebar: toggles a tile list on the left of every window,
# across the configured hosts. Hooks it installs cover new windows and close a
# sidebar left alone in its window.
bind-key C-t run-shell "laatmux sidebar"

# laatmux dashboard in a popup (cmd+shift+p). Enter jumps to the workspace and
# closes the popup; a opens the task form, x/X removes, s settles, S opens a
# shell, and on a background task's row p delivers its prompt and x dismisses
# it. -d makes the form's repository default to the repository of the current
# directory.
bind-key C-s display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T ' laatmux ' 'laatmux dashboard'

# laatmux task form (cmd+shift+t): chips for the repository, defaulting to the
# one of the current directory, the host and the agent, the last used or
# default_agent, a prompt, and a branch named from the prompt until edited.
# Tab moves between fields, Enter submits, Ctrl-J or Shift-Enter breaks a line
# (Shift-Enter through extended-keys and extkeys above). The add runs in the
# background in the laptop's daemon, the popup closes on accepted, and the
# task is a row in the sidebar and the dashboard until its worktree takes
# over; lms adds with the sandboxed agent.
bind-key T display-popup -E -w 80% -h 60% -d '#{pane_current_path}' -T ' task ' 'laatmux compose'


# laatmux: remove the worktree of the workspace session I'm in, with its
# managed session and this local session (cmd+shift+w), after one confirm.
# rm without a target takes the workspace from the session's tags. It runs in
# the background with its report discarded: run-shell's output would open in
# view mode over whatever pane is active once this session is gone, the
# sidebar say. A refusal, a dirty worktree with git's message for one, is
# shown in the status line until a key; x with X in the dashboard then
# force-removes it.
bind-key W confirm-before -p "remove this workspace and its worktree? (y/n)" {
  run-shell -b 'err=$(laatmux rm 2>&1 >/dev/null) || tmux display-message -l -d 0 "$err"'
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @smart-splits_move_left_key 'M-h'
set -g @smart-splits_move_down_key 'M-j'
set -g @smart-splits_move_up_key 'M-k'
set -g @smart-splits_move_right_key 'M-l'
set -g @smart-splits_resize_left_key 'M-H'
set -g @smart-splits_resize_down_key 'M-J'
set -g @smart-splits_resize_up_key 'M-K'
set -g @smart-splits_resize_right_key 'M-L'

# Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session} #{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text '%H:%M'

# TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
